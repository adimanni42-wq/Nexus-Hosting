name = "nexus-hosting"
main = "src/index.js"
compatibility_date = "2026-11-08"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "nexus-hosting-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Set OWNER_EMAIL to the email address you will use for the owner account.
# Do not put passwords or node credentials in this file.
OWNER_EMAIL = "you@example.com"
